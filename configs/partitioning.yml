input:
  encoding: utf-8
  separator: ","
  task_dataset: data/processed/amp_task.csv
  homology_root: data/homology
  homology_audit_summary: results/summaries/homology_audit_summary.csv
  homology_feasibility_runs: results/summaries/homology_split_feasibility.csv

dataset:
  task_column: task_id
  sequence_id_column: sequence_id
  label_column: amp_label

  included_tasks:
    - amp_vs_toxic_without_amp_evidence
    - amp_vs_without_amp_evidence

partitioning:
  proportions:
    train: 0.70
    validation: 0.15
    test: 0.15

  number_of_seeds: 100
  first_seed: 0

  random_stratified:
    enabled: true
    regime_id: RANDOM

  homology_configurations:
    - H90
    - H70
    - H50
    - H30

  reuse_audit_attempts: true
  require_audit_eligibility: true
  attempts_per_seed: 50

  objective_weights:
    total_size: 1.0
    positive_count: 1.0
    negative_count: 1.0

  overflow_penalty: 2.0

validation:
  maximum_split_size_deviation: 0.02
  maximum_prevalence_deviation: 0.01

  minimum_sequences_per_split: 30
  minimum_positive_sequences_per_split: 10
  minimum_negative_sequences_per_split: 10

  require_unique_partition_sets: true

output:
  partition_root: data/partitions
  assignment_format: csv.gz
  partition_index: results/summaries/partition_index.csv
  validation_summary: results/summaries/partition_validation.csv
  manifest: metadata/partition_generation_manifest.json
